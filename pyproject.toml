[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slideforge"
version = "1.0.0"
description = "SlideForge - AI-powered native PowerPoint generator. 把想法锻造为专业演示文稿。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SlideForge Team" }]
keywords = ["ppt", "powerpoint", "ai", "llm", "presentation", "generator"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "python-pptx>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
slideforge = "slideforge.cli:main"

[tool.setuptools]
packages = ["slideforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
